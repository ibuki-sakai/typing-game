<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動画連動タイピングゲーム</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        #player-container { margin: 20px auto; max-width: 560px; background: #000; min-height: 315px; display: flex; align-items: center; justify-content: center; color: white; }
        #typing-zone { margin: 20px auto; padding: 20px; background: white; max-width: 500px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #lyrics { font-size: 24px; font-weight: bold; min-height: 36px; color: #333; }
        #input-display { font-size: 20px; letter-spacing: 2px; margin-top: 10px; color: #888; }
        .typed { color: #2196F3; font-weight: bold; }
    </style>
</head>
<body>

    <h1>動画連動タイピング</h1>
    <p>動画プレイヤーが表示されたら、再生ボタン（▶）を押してください。</p>

    <!-- YouTubeプレイヤーが表示される場所 -->
    <div id="player-container">
        <div id="player">動画を読み込み中...</div>
    </div>

    <!-- タイピング画面 -->
    <div id="typing-zone">
        <div id="lyrics">動画を再生してください</div>
        <div id="input-display"></div>
    </div>

    <!-- YouTube Iframe API の読み込み -->
    <script src="https://youtube.com"></script>

    <script>
        // 譜面データ（動画の再生秒数に合わせて文字が変わります）
        const sequence = [
            { time: 1.0, text: "イントロ：タイピングの準備をしてください", target: "ready" },
            { time: 18.0, text: "歌が始まります！", target: "start" },
            { time: 19.0, text: "We're no strangers to love", target: "love" },
            { time: 23.0, text: "You know the rules and so do I", target: "rules" }
        ];

        let player;
        let currentIndex = -1;
        let typedText = "";

        // YouTubeプレイヤーの初期化
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '315',
                width: '560',
                videoId: 'dQw4w9WgXcQ', // 確実に再生できる公式動画ID
                playerVars: {
                    'playsinline': 1,
                    'rel': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        // エラーが起きた場合の通知
        function onPlayerError(e) {
            document.getElementById('player').innerText = "動画の読み込みに失敗しました。ページを再読み込みしてください。";
            console.error("YouTube Error Code:", e.data);
        }

        // 動画の再生状態を監視
        let timerId;
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                timerId = setInterval(checkTime, 100);
            } else {
                clearInterval(timerId);
            }
        }

        // 再生時間と譜面の照合
        function checkTime() {
            const currentTime = player.getCurrentTime();
            let foundIndex = -1;
            for (let i = 0; i < sequence.length; i++) {
                if (currentTime >= sequence[i].time) {
                    foundIndex = i;
                }
            }

            if (foundIndex !== currentIndex) {
                currentIndex = foundIndex;
                typedText = ""; 
                updateDisplay();
            }
        }

        // 画面表示の更新
        function updateDisplay() {
            const lyricsDiv = document.getElementById("lyrics");
            const displayDiv = document.getElementById("input-display");

            if (currentIndex === -1) {
                lyricsDiv.innerText = "動画が始まるまでお待ちください";
                displayDiv.innerHTML = "";
                return;
            }

            const currentData = sequence[currentIndex];
            lyricsDiv.innerText = currentData.text;

            let html = "";
            for (let i = 0; i < currentData.target.length; i++) {
                if (i < typedText.length) {
                    html += `<span class="typed">${currentData.target[i]}</span>`;
                } else {
                    html += `<span>${currentData.target[i]}</span>`;
                }
            }
            displayDiv.innerHTML = html;
        }

        // キー入力判定
        window.addEventListener("keydown", (e) => {
            if (currentIndex === -1) return;
            
            const currentData = sequence[currentIndex];
            const nextChar = currentData.target[typedText.length];

            if (e.key === nextChar) {
                typedText += e.key;
                updateDisplay();

                if (typedText === currentData.target) {
                    document.getElementById("lyrics").innerText = "✨ CLEAR! ✨";
                }
            }
        });
    </script>
</body>
</html>
