<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音楽連動タイピングゲーム</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; margin: 0; padding: 20px; }
        #audio-container { margin: 20px auto; max-width: 500px; padding: 15px; background: #e0e0e0; border-radius: 8px; }
        audio { width: 100%; }
        #typing-zone { margin: 20px auto; padding: 20px; background: white; max-width: 500px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #lyrics { font-size: 24px; font-weight: bold; min-height: 36px; color: #333; }
        #input-display { font-size: 20px; letter-spacing: 2px; margin-top: 10px; color: #888; }
        .typed { color: #2196F3; font-weight: bold; }
    </style>
</head>
<body>

    <h1>音楽連動タイピング</h1>
    <p>音楽プレイヤーの再生ボタン（▶）を押すとタイピングが始まります。</p>

    <!-- 音楽プレイヤー（アップロードしたファイル名に合わせました） -->
    <div id="audio-container">
        <audio id="my-audio" src="bgm.mp3.wav" controls></audio>
    </div>

    <!-- タイピング画面 -->
    <div id="typing-zone">
        <div id="lyrics">音楽を再生してください</div>
        <div id="input-display"></div>
    </div>

    <script>
        // 🎼 譜面データ（音楽の再生秒数に合わせて文字が変わります）
        // 実際の曲のタイミングに合わせて、後から秒数や歌詞を自由に変更できます
        const sequence = [
            { time: 1.0, text: "イントロ：タイピングの準備をしてください", target: "ready" },
            { time: 5.0, text: "音楽に合わせて打ち込んでください", target: "music" },
            { time: 10.0, text: "学校のタブレットでも動きます！", target: "school" },
            { time: 15.0, text: "ゲーム終了です！お疲れ様でした", target: "clear" }
        ];

        const audio = document.getElementById("my-audio");
        let currentIndex = -1;
        let typedText = "";

        // 音楽の再生状態を監視
        audio.addEventListener("timeupdate", () => {
            const currentTime = audio.currentTime; // 現在の再生秒数を取得
            
            let foundIndex = -1;
            for (let i = 0; i < sequence.length; i++) {
                if (currentTime >= sequence[i].time) {
                    foundIndex = i;
                }
            }

            if (foundIndex !== currentIndex) {
                currentIndex = foundIndex;
                typedText = ""; 
                updateDisplay();
            }
        });

        // 画面表示の更新
        function updateDisplay() {
            const lyricsDiv = document.getElementById("lyrics");
            const displayDiv = document.getElementById("input-display");

            if (currentIndex === -1) {
                lyricsDiv.innerText = "音楽が始まるまでお待ちください";
                displayDiv.innerHTML = "";
                return;
            }

            const currentData = sequence[currentIndex];
            lyricsDiv.innerText = currentData.text;

            let html = "";
            for (let i = 0; i < currentData.target.length; i++) {
                if (i < typedText.length) {
                    html += `<span class="typed">${currentData.target[i]}</span>`;
                } else {
                    html += `<span>${currentData.target[i]}</span>`;
                }
            }
            displayDiv.innerHTML = html;
        }

        // キー入力判定
        window.addEventListener("keydown", (e) => {
            if (currentIndex === -1) return;
            
            const currentData = sequence[currentIndex];
            const nextChar = currentData.target[typedText.length];

            if (e.key === nextChar) {
                typedText += e.key;
                updateDisplay();

                if (typedText === currentData.target) {
                    document.getElementById("lyrics").innerText = "✨ CLEAR! ✨";
                }
            }
        });
    </script>
</body>
</html>
