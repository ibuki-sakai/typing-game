<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYBREAK FRONTLINE - タイピングゲーム</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            background: #11141a; 
            color: #ffffff;
            margin: 0; 
            padding: 20px; 
        }
        h1 {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            font-size: 28px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #8892b0;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        #audio-container { 
            margin: 20px auto; 
            max-width: 600px; 
            padding: 15px; 
            background: #1e222b; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        audio { 
            width: 100%; 
        }
        #typing-zone { 
            margin: 20px auto; 
            padding: 30px 20px; 
            background: #1e222b; 
            max-width: 600px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0, 210, 255, 0.15);
            border: 1px solid #2d3748;
        }
        #lyrics { 
            font-size: 26px; 
            font-weight: bold; 
            min-height: 40px; 
            color: #ffffff; 
            margin-bottom: 15px;
        }
        #input-display { 
            font-size: 22px; 
            letter-spacing: 2px; 
            font-family: 'Courier New', Courier, monospace;
            color: #4a5568; 
            min-height: 30px;
        }
        .typed { 
            color: #00d2ff; 
            font-weight: bold; 
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
        }
        .status-msg {
            color: #ff007f;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <h1>DAYBREAK FRONTLINE</h1>
    <div class="subtitle">Music: Orangestar / Typing Game</div>

    <!-- 音楽プレイヤー -->
    <div id="audio-container">
        <audio id="my-audio" src="bgm.mp3.wav" controls></audio>
    </div>

    <!-- タイピング画面 -->
    <div id="typing-zone">
        <div id="lyrics">音楽を再生してください</div>
        <div id="input-display"></div>
    </div>

    <script>
        // 🎼 譜面データ：DAYBREAK FRONTLINEの歌い出し部分
        // ※音源の無音部分の長さによってズレる場合、time（秒数）を微調整してください
        const sequence = [
            { time: 1.0,  text: "間奏：タイピングの準備をしてください", target: "ready" },
            { time: 14.5, text: "最前線飛ばせ僕たちは", target: "saizensentobasebokutachiha" },
            { time: 18.0, text: "空回る世界の暗がりを駆け抜けろ", target: "karamaruvekaidokuragariwokakenukero" },
            { time: 22.0, text: "君のいない未来は色のない世界", target: "kiminoinaimiraihairotonaivekai" },
            { time: 25.5, text: "向かい風等とのとも無い", target: "mukaikazekotonotomonai" },
            { time: 28.5, text: "一歩引いたってしょうがないだろ？", target: "ippohiitatteshouganaidaro" },
            { time: 32.5, text: "思いのままに突き進め！", target: "omoinomamanitukisusume" }
        ];

        const audio = document.getElementById("my-audio");
        let currentIndex = -1;
        let typedText = "";

        // 音楽の再生時間をリアルタイム監視
        audio.addEventListener("timeupdate", () => {
            const currentTime = audio.currentTime;
            
            let foundIndex = -1;
            for (let i = 0; i < sequence.length; i++) {
                if (currentTime >= sequence[i].time) {
                    foundIndex = i;
                }
            }

            if (foundIndex !== currentIndex) {
                currentIndex = foundIndex;
                typedText = ""; 
                updateDisplay();
            }
        });

        // 画面表示を更新する関数
        function updateDisplay() {
            const lyricsDiv = document.getElementById("lyrics");
            const displayDiv = document.getElementById("input-display");

            if (currentIndex === -1) {
                lyricsDiv.innerHTML = '<span class="status-msg">▶ボタンを押してスタート！</span>';
                displayDiv.innerHTML = "";
                return;
            }

            const currentData = sequence[currentIndex];
            lyricsDiv.innerText = currentData.text;

            // タイピング済みの文字と未入力の文字で色を分ける
            let html = "";
            for (let i = 0; i < currentData.target.length; i++) {
                if (i < typedText.length) {
                    html += `<span class="typed">${currentData.target[i]}</span>`;
                } else {
                    html += `<span>${currentData.target[i]}</span>`;
                }
            }
            displayDiv.innerHTML = html;
        }

        // キー入力判定
        window.addEventListener("keydown", (e) => {
            // 無効なキー（ShiftやCtrlなど）やゲーム開始前は無視
            if (currentIndex === -1 || e.key.length > 1) return;
            
            const currentData = sequence[currentIndex];
            const nextChar = currentData.target[typedText.length];

            // 入力されたキーが合致しているかチェック（小文字で統一）
            if (e.key.toLowerCase() === nextChar) {
                typedText += nextChar;
                updateDisplay();

                // 1フレーズクリアした時のエフェクト
                if (typedText === currentData.target) {
                    document.getElementById("lyrics").innerHTML = "✨ OK! ✨";
                }
            }
        });
    </script>
</body>
</html>
