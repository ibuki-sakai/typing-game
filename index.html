<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYBREAK FRONTLINE - タイピングゲーム</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            background: #11141a; 
            color: #ffffff;
            margin: 0; 
            padding: 20px; 
        }
        h1 {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            font-size: 28px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #8892b0;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 🎧 カスタム音楽プレイヤー */
        #custom-player {
            margin: 20px auto; 
            max-width: 600px; 
            padding: 20px; 
            background: #1e222b; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2d3748;
            display: flex;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
        }

        #play-btn {
            background: #00d2ff;
            border: none;
            color: #11141a;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            transition: all 0.2s ease;
            min-width: 80px;
        }
        #play-btn:hover {
            background: #00bcd4;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            transform: scale(1.03);
        }

        #progress-container {
            flex-grow: 1;
            background: #2d3748;
            height: 8px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        #progress-bar {
            background: linear-gradient(90deg, #00d2ff, #00f5ff);
            height: 100%;
            width: 0%; 
            border-radius: 4px;
            box-shadow: 0 0 8px #00d2ff;
            transition: width 0.1s linear;
        }

        #time-display {
            font-family: monospace;
            color: #a0aec0;
            font-size: 14px;
            min-width: 45px;
        }

        /* ─── タイピングゾーン ─── */
        #typing-zone { 
            margin: 20px auto; 
            padding: 30px 24px 15px 24px;
            background: #1e222b; 
            max-width: 600px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0, 210, 255, 0.15);
            border: 1px solid #2d3748;
            box-sizing: border-box;
            position: relative;
            transition: background-color 0.1s ease, border-color 0.1s ease;
        }
        #typing-zone.miss {
            background-color: #2d1a22;
            border-color: #ff0055;
            box-shadow: 0 8px 24px rgba(255, 0, 85, 0.2);
        }

        /* ⏳ カウントダウン表示エリア */
        #countdown-container {
            margin-bottom: 15px;
            min-height: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        #countdown-text {
            font-size: 14px;
            color: #ffaa00;
            font-weight: bold;
            font-family: monospace;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
        }
        #countdown-text.typing-now {
            color: #00d2ff;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }
        #countdown-bar-bg {
            width: 50%;
            background: #2d3748;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }
        #countdown-bar {
            background: #ffaa00;
            height: 100%;
            width: 0%;
            box-shadow: 0 0 6px #ffaa00;
        }
        #countdown-bar.typing-now {
            background: #00d2ff;
            box-shadow: 0 0 6px #00d2ff;
        }

        #lyrics { 
            font-size: 24px; 
            font-weight: bold; 
            min-height: 40px; 
            color: #ffffff; 
            margin-bottom: 15px;
            word-break: break-all;
            line-height: 1.4;
        }
        #input-display { 
            font-size: 20px; 
            letter-spacing: 1px; 
            font-family: 'Courier New', Courier, monospace;
            color: #4a5568; 
            min-height: 30px;
            word-break: break-all;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 15px;
        }
        .typed { 
            color: #00d2ff; 
            font-weight: bold; 
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
        }
        .status-msg {
            color: #00d2ff;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        .clear-msg {
            color: #00ffaa;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.6);
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* ⌨️ スペースキーのスキップガイド */
        #skip-guide {
            font-size: 11px;
            color: #4a5568;
            text-align: right;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }
        #skip-guide.active {
            color: #ffaa00; 
        }

        /* 🔄 リトライボタン */
        #retry-btn {
            background: #00ffaa;
            border: none;
            color: #11141a;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.3);
        }
        #retry-btn:hover {
            background: #00cc88;
        }
    </style>
</head>
<body>

    <h1>DAYBREAK FRONTLINE</h1>
    <div class="subtitle">Music: Orangestar / Typing Game</div>

    <!-- 本物の音楽タグ -->
    <audio id="my-audio" src="bgm.mp3.wav"></audio>

    <!-- 🎧 自作したおしゃれな音楽プレイヤー -->
    <div id="custom-player">
        <button id="play-btn">PLAY</button>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="time-display">0:00</div>
    </div>

    <!-- タイピング画面 -->
    <div id="typing-zone">
        <div id="countdown-container">
            <div id="countdown-text"></div>
            <div id="countdown-bar-bg">
                <div id="countdown-bar"></div>
            </div>
        </div>
        
        <div id="lyrics"></div>
        <div id="input-display"></div>
        <div id="skip-guide">[Space] Skip</div>
    </div>

    <script>
        // 【重要】配列の中身を「日本語（ひらがな）」に変更します
        // プログラムが自動で全てのローマ字パターンをリアルタイム解析します
        const sequence = [
            { time: 0,    text: "間奏：タイピングの準備をしてください", target: "ready" },
            { time: 42.5, text: "眠れないんだ風もなく茹だりそうな夜に", target: "ねむれないんだかぜもなくうだりそうなよるに" },
            { time: 46,   text: "君の声が耳元で揺らいだ感傷に浸ってばっか", target: "きみのこえがみみもとでゆらいだかんしょうにひたってばっか" },
            { time: 51,   text: "何も変わらない笑えない日々を", target: "なにもかわらないわらえないひびを" },
            { time: 53,   text: "抜け出そうぜ君を連れ飛び出した", target: "ぬけだそうぜきみをつれとびだした" },
        ];

        // ─── 🤖 自動ローマ字マッピング辞書 ───
        const romanMap = {
            'あ':['a'],'い':['i','yi'],'う':['u','wu'],'え':['e','ye'],'お':['o'],
            'か':['ka','ca'],'き':['ki'],'く':['ku','cu','qu'],'け':['ke','cl'],/*cl除外可*/'こ':['ko','co'],
            'さ':['sa'],'し':['si','shi','ci'],'す':['su'],'せ':['se'],'そ':['so'],
            'た':['ta'],'ち':['ti','chi'],'つ':['tu','tsu'],'て':['te'],'と':['to'],
            'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
            'は':['ha'],'ひ':['hi'],'ふ':['hu','fu'],'へ':['he'],'ほ':['ho'],
            'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
            'や':['ya'],'ゆ':['yu'],'よ':['yo'],
            'ら':['ra'],'り':['ri'],'る':['ru'],'れ':['re'],'ろ':['ro'],
            'わ':['wa'],'を':['wo'],'ん':['nn','n','xn'],
            'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
            'ざ':['za'],'じ':['zi','ji'],'ず':['zu','zu'],
            'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
            'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
            'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
            'ぁ':['la','xa'],'ぃ':['li','xi'],'ぅ':['lu','xu'],'ぇ':['le','xe'],'ぉ':['lo','xo'],
            'ゃ':['lya','xya'],'ゅ':['lyu','xyu'],'ょ':['lyo','xyo'],
            'っ':['ltu','xtu','ltsu'],
            'うぁ':['wha'],'うぃ':['whi','wi'],'うぇ':['whe','we'],'うぉ':['who'],
            'きゃ':['kya'],'きぃ':['kyi'],'きゅ':['kyu'],'きぇ':['kye'],'きょ':['kyo'],
            'しゃ':['sya','sha'],'しぃ':['syi'],'しゅ':['syu','shu'],'しぇ':['sye','she'],'しょ':['sya','sho'],
            'ちゃ':['tya','cha'],'ちぃ':['tyi'],'ちゅ':['tyu','chu'],'ちぇ':['tye','che'],'ちょ':['tyo','cho'],
            'にゃ':['nya'],'にぃ':['nyi'],'にゅ':['nyu'],'にぇ':['nye'],'にょ':['nyo'],
            'ひゃ':['hya'],'ひぃ':['hyi'],'ひゅ':['hyu'],'ひぇ':['hye'],'ひょ':['hyo'],
            'みゃ':['mya'],'みぃ':['myi'],'みゅ':['myu'],'みぇ':['mye'],'みょ':['myo'],
            'りゃ':['rya'],'りぃ':['ryi'],'りゅ':['ryu'],'りぇ':['bye'],'りょ':['ryo'],
            'ぎゃ':['gya'],'ぎぃ':['gyi'],'ぎゅ':['gyu'],'ぎぇ':['gye'],'ぎょ':['gyo'],
            'じゃ':['zya','ja'],'じぃ':['zyi'],'じゅ':['zyu','ju'],'じぇ':['zye','je'],'じょ':['zyo','jo'],
            'びゃ':['bya'],'びぃ':['byi'],'びゅ':['byu'],'びぇ':['bye'],'びょ':['byo'],
            'ぴゃ':['pya'],'ぴぃ':['pyi'],'ぴゅ':['pyu'],'ぴぇ':['pye'],'ぴょ':['pyo'],
            'ふぁ':['fa','fwa'],'ふぃ':['fi','fwi'],'ふぇ':['fe','fwe'],'ふぉ':['fo','fwo']
        };

        const audio = document.getElementById("my-audio");
        const playBtn = document.getElementById("play-btn");
        const progressBar = document.getElementById("progress-bar");
        const progressContainer = document.getElementById("progress-container");
        const timeDisplay = document.getElementById("time-display");
        const typingZone = document.getElementById("typing-zone");
        const countdownText = document.getElementById("countdown-text");
        const countdownBar = document.getElementById("countdown-bar");
        const countdownBarBg = document.getElementById("countdown-bar-bg");
        const skipGuide = document.getElementById("skip-guide");

        let currentIndex = -1;
        let isGameClear = false;

        // ─── 🧠 タイピング状態管理オブジェクト ───
        let currentKanaStr = ""; 
        let typedRoman = "";     // 入力済みのローマ字
        let remainingRoman = ""; // 画面表示用のデフォルトの残りローマ字

        function updatePlayButton() {
            if (audio.paused) {
                playBtn.innerText = "PLAY";
                playBtn.style.background = "#00d2ff"; 
            } else {
                playBtn.innerText = "PAUSE";
                playBtn.style.background = "#ff007f"; 
            }
        }

        playBtn.addEventListener("click", () => {
            if (isGameClear) return;
            if (audio.paused) audio.play();
            else audio.pause();
            updatePlayButton();
        });

        audio.addEventListener("timeupdate", () => {
            if (isGameClear) return;
            const currentTime = audio.currentTime;
            const duration = audio.duration || 0;

            if (duration > 0) {
                progressBar.style.width = `${(currentTime / duration) * 100}%`;
            }

            const minutes = Math.floor(currentTime / 60);
            const seconds = Math.floor(currentTime % 60).toString().padStart(2, '0');
            timeDisplay.innerText = `${minutes}:${seconds}`;

            let foundIndex = -1;
            for (let i = 0; i < sequence.length; i++) {
                if (currentTime >= sequence[i].time) foundIndex = i;
            }

            if (foundIndex !== currentIndex) {
                currentIndex = foundIndex;
                initPhrase();
            }
            updateCountdown(currentTime);
        });

        audio.addEventListener("ended", () => { showClearScreen(); });

        // フレーズが切り替わった時の初期化
        function initPhrase() {
            typedRoman = "";
            remainingRoman = "";
            if (currentIndex !== -1) {
                currentKanaStr = sequence[currentIndex].target;
                if(currentKanaStr !== "ready") {
                    remainingRoman = makeDefaultRoman(currentKanaStr);
                } else {
                    remainingRoman = "ready";
                }
            }
            updateDisplay();
        }

        // ひらがなからデフォルトの一番標準的なローマ字文字列を生成する
        function makeDefaultRoman(kana) {
            let res = "";
            let i = 0;
            while(i < kana.length) {
                if(i+1 < kana.length && romanMap[kana.substr(i,2)]) {
                    res += romanMap[kana.substr(i,2)][0];
                    i += 2;
                } else if(kana[i] === 'っ' && i+1 < kana.length) {
                    // 次の文字のデフォルトローマ字の頭文字を重ねる
                    let nextKana = kana[i+1];
                    let nextRom = romanMap[nextKana] ? romanMap[nextKana][0] : "";
                    if(nextRom) { res += nextRom[0]; }
                    else { res += "xtu"; }
                    i++;
                } else {
                    res += romanMap[kana[i]] ? romanMap[kana[i]][0] : kana[i];
                    i++;
                }
            }
            return res;
        }

        // 現在の位置から、入力可能なローマ字の全ルートパターンを再帰的に探すコアロジック
        function checkInput(kanaStr, inputStr) {
            if (inputStr === "") return { match: true, remainingKana: kanaStr };
            if (kanaStr === "") return { match: false };

            // 1. 2文字の特殊なひらがな（「きゃ」「ふぁ」など）をチェック
            if (kanaStr.length >= 2) {
                let doubleChar = kanaStr.substr(0, 2);
                if (romanMap[doubleChar]) {
                    for (let r of romanMap[doubleChar]) {
                        if (inputStr.startsWith(r)) {
                            let res = checkInput(kanaStr.substr(2), inputStr.substr(r.length));
                            if (res.match) return res;
                        }
                        if (r.startsWith(inputStr)) {
                            return { match: true, remainingKana: kanaStr };
                        }
                    }
                }
            }

            // 2. 1文字のひらがなをチェック
            let singleChar = kanaStr[0];
            
            // 「っ」の特殊判定（子音重ね）
            if (singleChar === 'っ' && kanaStr.length >= 2) {
                let nextChar = kanaStr[1];
                let nextRomans = romanMap[nextChar] || [];
                for (let nr of nextRomans) {
                    let firstChar = nr[0]; // 子音の1文字目 (例: t, k, s)
                    if (inputStr.startsWith(firstChar)) {
                        // 子音1文字を消費して「っ」を突破し、次は普通にnextChar以降を処理させる
                        let res = checkInput(kanaStr.substr(1), inputStr.substr(1));
                        if (res.match) return res;
                    }
                    if (firstChar === inputStr) {
                        return { match: true, remainingKana: kanaStr };
                    }
                }
            }

            // 「ん」の特殊判定（単体nで次が子音の場合）
            if (singleChar === 'ん' && kanaStr.length >= 2) {
                let nextChar = kanaStr[1];
                // 次の文字が母音・あ行・な行・や行以外なら、n単体でも通す
                if (!['あ','い','う','え','お','な','に','ぬ','ね','の','や','ゆ','よ','ん','ぁ','ぃ','ぅ','ぇ','ぉ','ゃ','ゅ','ょ'].includes(nextChar)) {
                    if (inputStr.startsWith('n')) {
                        let res = checkInput(kanaStr.substr(1), inputStr.substr(1));
                        if (res.match) return res;
                    }
                }
            }

            // 通常の1文字辞書チェック
            if (romanMap[singleChar]) {
                for (let r of romanMap[singleChar]) {
                    if (inputStr.startsWith(r)) {
                        let res = checkInput(kanaStr.substr(1), inputStr.substr(r.length));
                        if (res.match) return res;
                    }
                    if (r.startsWith(inputStr)) {
                        return { match: true, remainingKana: kanaStr };
                    }
                }
            }

            // 特殊文字やreadyなどアルファベットそのままの場合
            if (inputStr.toLowerCase() === singleChar.toLowerCase()) {
                return { match: true, remainingKana: kanaStr.substr(1) };
            }
            if (singleChar.toLowerCase().startsWith(inputStr.toLowerCase())) {
                return { match: true, remainingKana: kanaStr };
            }

            return { match: false };
        }

        function isPhraseComplete() {
            if (currentIndex === -1) return false;
            if (currentKanaStr === "ready") return typedRoman === "ready";
            // 残りのかな文字がない＝打ち終わっている
            let check = checkInput(currentKanaStr, typedRoman);
            return check.match && check.remainingKana === "";
        }

        function updateCountdown(currentTime) {
            if (isGameClear || currentIndex === -1) {
                clearCountdown();
                return;
            }

            let completed = isPhraseComplete();

            if (currentIndex === sequence.length - 1) {
                if (completed) {
                    showClearScreen();
                } else {
                    const duration = audio.duration || sequence[currentIndex].time + 5;
                    const timeLeft = duration - currentTime;
                    if (timeLeft > 0) {
                        countdownText.innerText = `Finish... ${timeLeft.toFixed(1)}s`;
                        countdownText.classList.add("typing-now");
                    } else { clearCountdown(); }
                }
                return;
            }

            const currentStartTime = sequence[currentIndex].time;
            const nextStartTime = sequence[currentIndex + 1].time;
            const timeLeft = nextStartTime - currentTime;

            if (timeLeft > 0) {
                const totalWaitTime = nextStartTime - currentStartTime;
                const progressPercent = (timeLeft / totalWaitTime) * 100;

                countdownBar.style.width = `${progressPercent}%`;
                countdownBarBg.style.opacity = "1";

                if (completed) {
                    skipGuide.classList.add("active");
                    countdownText.innerText = `Next... ${timeLeft.toFixed(1)}s`;
                    countdownText.classList.remove("typing-now");
                    countdownBar.classList.remove("typing-now");
                } else {
                    skipGuide.classList.remove("active");
                    countdownText.innerText = `Time Limit... ${timeLeft.toFixed(1)}s`;
                    countdownText.classList.add("typing-now");
                    countdownBar.classList.add("typing-now");
                }
            } else { clearCountdown(); }
        }

        function clearCountdown() {
            countdownText.innerText = "";
            countdownBar.style.width = "0%";
            countdownBarBg.style.opacity = "0";
            skipGuide.classList.remove("active");
        }

        progressContainer.addEventListener("click", (e) => {
            if (isGameClear) return;
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
                currentIndex = -2; 
            }
        });

        function updateDisplay() {
            if (isGameClear) return;

            const lyricsDiv = document.getElementById("lyrics");
            const displayDiv = document.getElementById("input-display");

            if (currentIndex === -1) {
                lyricsDiv.innerHTML = '<span class="status-msg">▶ボタンを押してスタート！</span>';
                displayDiv.innerHTML = "";
                clearCountdown();
                return;
            }

            let completed = isPhraseComplete();
            const currentData = sequence[currentIndex];
            
            if (completed && currentData.target !== "ready") {
                lyricsDiv.innerHTML = '<span class="clear-msg">✨ OK! ✨</span>';
            } else {
                lyricsDiv.innerText = currentData.text;
            }

            // 表示用文字列のアップデート
            // ユーザーがタイピングした確定部分 + まだ打っていない残りの部分(予測)
            let check = checkInput(currentKanaStr, typedRoman);
            if (check.match) {
                remainingRoman = makeDefaultRoman(check.remainingKana);
            }

            let html = `<span class="typed">${typedRoman}</span><span>${remainingRoman}</span>`;
            displayDiv.innerHTML = html;
        }

        function showClearScreen() {
            isGameClear = true;
            audio.pause();
            updatePlayButton();
            clearCountdown();
            document.getElementById("lyrics").innerHTML = '<span class="clear-msg">🎉 GAME CLEAR! 🎉</span>';
            document.getElementById("input-display").innerHTML = '<button id="retry-btn" onclick="resetGame()">もう一度遊ぶ</button>';
        }

        function resetGame() {
            isGameClear = false;
            currentIndex = -1;
            audio.currentTime = 0;
            initPhrase();
            audio.play();
            updatePlayButton();
        }

        // キー入力判定
        window.addEventListener("keydown", (e) => {
            if (currentIndex === -1 || isGameClear) return;

            // スペースキーでのスキップ
            if (e.key === " " || e.key === "Spacebar") {
                e.preventDefault(); 
                if (isPhraseComplete()) {
                    if (currentIndex < sequence.length - 1) {
                        audio.currentTime = sequence[currentIndex + 1].time;
                    } else {
                        showClearScreen();
                    }
                }
                return;
            }

            if (e.key.length > 1) return;
            if (isPhraseComplete()) return;

            // 仮に新しいキーを追加した文字列を作って検証
            let testInput = typedRoman + e.key.toLowerCase();
            let check = checkInput(currentKanaStr, testInput);

            if (check.match) {
                // 有効なルートが存在すれば確定
                typedRoman = testInput;
                updateDisplay();
                updateCountdown(audio.currentTime);
            } else {
                // どのルートにも繋がらなければミス
                typingZone.classList.add("miss");
                setTimeout(() => { typingZone.classList.remove("miss"); }, 100);
            }
        });

        updateDisplay();
    </script>
</body>
</html>
