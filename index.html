<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYBREAK FRONTLINE - タイピングゲーム</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            background: #11141a; 
            color: #ffffff;
            margin: 0; 
            padding: 20px; 
        }
        h1 {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            font-size: 28px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #8892b0;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 🎧 カスタム音楽プレイヤー */
        #custom-player {
            margin: 20px auto; 
            max-width: 600px; 
            padding: 20px; 
            background: #1e222b; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2d3748;
            display: flex;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
        }

        #play-btn {
            background: #00d2ff;
            border: none;
            color: #11141a;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            transition: all 0.2s ease;
            min-width: 80px;
        }
        #play-btn:hover {
            background: #00bcd4;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            transform: scale(1.03);
        }

        #progress-container {
            flex-grow: 1;
            background: #2d3748;
            height: 8px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        #progress-bar {
            background: linear-gradient(90deg, #00d2ff, #00f5ff);
            height: 100%;
            width: 0%; 
            border-radius: 4px;
            box-shadow: 0 0 8px #00d2ff;
            transition: width 0.1s linear;
        }

        #time-display {
            font-family: monospace;
            color: #a0aec0;
            font-size: 14px;
            min-width: 45px;
        }

        /* ─── タイピングゾーン ─── */
        #typing-zone { 
            margin: 20px auto; 
            padding: 30px 24px 15px 24px;
            background: #1e222b; 
            max-width: 600px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0, 210, 255, 0.15);
            border: 1px solid #2d3748;
            box-sizing: border-box;
            position: relative;
            transition: background-color 0.1s ease, border-color 0.1s ease;
        }
        #typing-zone.miss {
            background-color: #2d1a22;
            border-color: #ff0055;
            box-shadow: 0 8px 24px rgba(255, 0, 85, 0.2);
        }

        /* ⏳ カウントダウン表示エリア */
        #countdown-container {
            margin-bottom: 15px;
            min-height: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        #countdown-text {
            font-size: 14px;
            color: #ffaa00;
            font-weight: bold;
            font-family: monospace;
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.4);
        }
        /* タイピング中のカウントダウン表示（水色） */
        #countdown-text.typing-now {
            color: #00d2ff;
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.4);
        }
        #countdown-bar-bg {
            width: 50%;
            background: #2d3748;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }
        #countdown-bar {
            background: #ffaa00;
            height: 100%;
            width: 0%;
            box-shadow: 0 0 6px #ffaa00;
        }
        #countdown-bar.typing-now {
            background: #00d2ff;
            box-shadow: 0 0 6px #00d2ff;
        }

        #lyrics { 
            font-size: 24px; 
            font-weight: bold; 
            min-height: 40px; 
            color: #ffffff; 
            margin-bottom: 15px;
            word-break: break-all;
            line-height: 1.4;
        }
        #input-display { 
            font-size: 20px; 
            letter-spacing: 1px; 
            font-family: 'Courier New', Courier, monospace;
            color: #4a5568; 
            min-height: 30px;
            word-break: break-all;
            line-height: 1.5;
            text-align: center;
            margin-bottom: 15px;
        }
        .typed { 
            color: #00d2ff; 
            font-weight: bold; 
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
        }
        .status-msg {
            color: #00d2ff;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        .clear-msg {
            color: #00ffaa;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.6);
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* ⌨️ スペースキーのスキップガイド */
        #skip-guide {
            font-size: 11px;
            color: #4a5568;
            text-align: right;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: color 0.2s ease;
        }
        #skip-guide.active {
            color: #ffaa00; /* スキップ可能な時（打ち終わった時）だけオレンジに光る */
        }

        /* 🔄 リトライボタン */
        #retry-btn {
            background: #00ffaa;
            border: none;
            color: #11141a;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.3);
        }
        #retry-btn:hover {
            background: #00cc88;
        }
    </style>
</head>
<body>

    <h1>DAYBREAK FRONTLINE</h1>
    <div class="subtitle">Music: Orangestar / Typing Game</div>

    <!-- 本物の音楽タグ -->
    <audio id="my-audio" src="bgm.mp3.wav"></audio>

    <!-- 🎧 自作したおしゃれな音楽プレイヤー -->
    <div id="custom-player">
        <button id="play-btn">PLAY</button>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="time-display">0:00</div>
    </div>

    <!-- タイピング画面 -->
    <div id="typing-zone">
        <!-- ⏳ カウントダウン表示用の枠 -->
        <div id="countdown-container">
            <div id="countdown-text"></div>
            <div id="countdown-bar-bg">
                <div id="countdown-bar"></div>
            </div>
        </div>
        
        <div id="lyrics"></div>
        <div id="input-display"></div>

        <!-- ⌨️ スキップのガイド表示 -->
        <div id="skip-guide">[Space] Skip</div>
    </div>

    <script>
        const sequence = [
            { time: 0,    text: "間奏：タイピングの準備をしてください", target: "ready" },
            { time: 42.5, text: "眠れないんだ風もなく茹だりそうな夜に", target: "nemurenaindakazemonakuudarisounayoruni" },
            { time: 46,   text: "君の声が耳元で揺らいだ感傷に浸ってばっか", target: "kiminokoegamimimotodeyuraidakannshounihitattebakka" },
            { time: 51,   text: "何も変わらない笑えない日々を", target: "nanimokawaranaiwaraenaihibiwo" },
            { time: 53,   text: "抜け出そうぜ君を連れ飛び出した", target: "nukedasouzekimiwoturetobidashita" },
        ];
        const audio = document.getElementById("my-audio");
        const playBtn = document.getElementById("play-btn");
        const progressBar = document.getElementById("progress-bar");
        const progressContainer = document.getElementById("progress-container");
        const timeDisplay = document.getElementById("time-display");
        const typingZone = document.getElementById("typing-zone");

        // 要素の取得
        const countdownText = document.getElementById("countdown-text");
        const countdownBar = document.getElementById("countdown-bar");
        const countdownBarBg = document.getElementById("countdown-bar-bg");
        const skipGuide = document.getElementById("skip-guide");

        let currentIndex = -1;
        let typedText = "";
        let isGameClear = false;

        function updatePlayButton() {
            if (audio.paused) {
                playBtn.innerText = "PLAY";
                playBtn.style.background = "#00d2ff"; 
                playBtn.style.boxShadow = "0 0 10px rgba(0, 210, 255, 0.3)";
            } else {
                playBtn.innerText = "PAUSE";
                playBtn.style.background = "#ff007f"; 
                playBtn.style.boxShadow = "0 0 10px rgba(255, 0, 127, 0.3)";
            }
        }

        playBtn.addEventListener("click", () => {
            if (isGameClear) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            updatePlayButton();
        });

        audio.addEventListener("timeupdate", () => {
            if (isGameClear) return;

            const currentTime = audio.currentTime;
            const duration = audio.duration || 0;

            if (duration > 0) {
                const progressPercent = (currentTime / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
            }

            const minutes = Math.floor(currentTime / 60);
            const seconds = Math.floor(currentTime % 60).toString().padStart(2, '0');
            timeDisplay.innerText = `${minutes}:${seconds}`;

            let foundIndex = -1;
            for (let i = 0; i < sequence.length; i++) {
                if (currentTime >= sequence[i].time) {
                    foundIndex = i;
                }
            }

            if (foundIndex !== currentIndex) {
                currentIndex = foundIndex;
                typedText = ""; 
                updateDisplay();
            }

            updateCountdown(currentTime);
        });

        audio.addEventListener("ended", () => {
            showClearScreen();
        });

        // ⏳ カウントダウンとスキップ管理
        function updateCountdown(currentTime) {
            if (isGameClear || currentIndex === -1) {
                clearCountdown();
                return;
            }

            // 最後のフレーズの場合
            if (currentIndex === sequence.length - 1) {
                if (typedText === sequence[currentIndex].target) {
                    showClearScreen();
                } else {
                    const duration = audio.duration || sequence[currentIndex].time + 5;
                    const timeLeft = duration - currentTime;
                    if (timeLeft > 0) {
                        countdownText.innerText = `Finish... ${timeLeft.toFixed(1)}s`;
                        countdownText.classList.add("typing-now");
                    } else {
                        clearCountdown();
                    }
                }
                return;
            }

            const currentStartTime = sequence[currentIndex].time;
            const nextStartTime = sequence[currentIndex + 1].time;
            const timeLeft = nextStartTime - currentTime;

            if (timeLeft > 0) {
                const totalWaitTime = nextStartTime - currentStartTime;
                const progressPercent = (timeLeft / totalWaitTime) * 100;

                countdownBar.style.width = `${progressPercent}%`;
                countdownBarBg.style.opacity = "1";

                // 【スキップ可否による見た目の制御】
                if (typedText === sequence[currentIndex].target || sequence[currentIndex].target === "ready") {
                    // スキップ可能（次のフレーズを待っている状態） -> オレンジ
                    skipGuide.classList.add("active");
                    countdownText.innerText = `Next... ${timeLeft.toFixed(1)}s`;
                    countdownText.classList.remove("typing-now");
                    countdownBar.classList.remove("typing-now");
                } else {
                    // タイピング中（まだ未完了） -> 水色。ガイドの光は消す
                    skipGuide.classList.remove("active");
                    countdownText.innerText = `Time Limit... ${timeLeft.toFixed(1)}s`;
                    countdownText.classList.add("typing-now");
                    countdownBar.classList.add("typing-now");
                }
            } else {
                clearCountdown();
            }
        }

        function clearCountdown() {
            countdownText.innerText = "";
            countdownBar.style.width = "0%";
            countdownBarBg.style.opacity = "0";
            skipGuide.classList.remove("active");
        }

        progressContainer.addEventListener("click", (e) => {
            if (isGameClear) return;
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
                currentIndex = -2; 
            }
        });

        function updateDisplay() {
            if (isGameClear) return;

            const lyricsDiv = document.getElementById("lyrics");
            const displayDiv = document.getElementById("input-display");

            if (currentIndex === -1) {
                lyricsDiv.innerHTML = '<span class="status-msg">▶ボタンを押してスタート！</span>';
                displayDiv.innerHTML = "";
                clearCountdown();
                return;
            }

            const currentData = sequence[currentIndex];
            
            if (typedText === currentData.target && currentData.target !== "ready") {
                lyricsDiv.innerHTML = '<span class="clear-msg">✨ OK! ✨</span>';
            } else {
                lyricsDiv.innerText = currentData.text;
            }

            let html = "";
            for (let i = 0; i < currentData.target.length; i++) {
                if (i < typedText.length) {
                    html += `<span class="typed">${currentData.target[i]}</span>`;
                } else {
                    html += `<span>${currentData.target[i]}</span>`;
                }
            }
            displayDiv.innerHTML = html;
        }

        function showClearScreen() {
            isGameClear = true;
            audio.pause();
            updatePlayButton();
            
            clearCountdown();
            document.getElementById("lyrics").innerHTML = '<span class="clear-msg">🎉 GAME CLEAR! 🎉</span>';
            document.getElementById("input-display").innerHTML = '<button id="retry-btn" onclick="resetGame()">もう一度遊ぶ</button>';
        }

        function resetGame() {
            isGameClear = false;
            currentIndex = -1;
            typedText = "";
            audio.currentTime = 0;
            updateDisplay();
            audio.play();
            updatePlayButton();
        }

        // キー入力判定
        window.addEventListener("keydown", (e) => {
            if (currentIndex === -1 || isGameClear) return;

            // 💡 スペースキーでのスキップ
            if (e.key === " " || e.key === "Spacebar") {
                e.preventDefault(); // 画面スクロール防止

                // 【修正】打ち終わっている状態 or 最初のReady状態のとき「だけ」スキップを許可
                if (typedText === sequence[currentIndex].target || sequence[currentIndex].target === "ready") {
                    if (currentIndex < sequence.length - 1) {
                        audio.currentTime = sequence[currentIndex + 1].time;
                    } else {
                        showClearScreen();
                    }
                }
                return; // タイピング中の場合は何もせずスルー
            }

            if (e.key.length > 1) return;
            
            const currentData = sequence[currentIndex];
            if (typedText === currentData.target) return;

            const nextChar = currentData.target[typedText.length];

            if (e.key.toLowerCase() === (nextChar ? nextChar.toLowerCase() : "")) {
                typedText += nextChar;
                updateDisplay();

                if (typedText === currentData.target) {
                    updateDisplay();
                    updateCountdown(audio.currentTime);
                }
            } else {
                typingZone.classList.add("miss");
                setTimeout(() => {
                    typingZone.classList.remove("miss");
                }, 100);
            }
        });

        updateDisplay();
    </script>
</body>
</html>
