<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYBREAK FRONTLINE - タイピングゲーム</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            background: #11141a; 
            color: #ffffff;
            margin: 0; 
            padding: 20px; 
        }
        h1 {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            font-size: 28px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #8892b0;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 🎧 おしゃれにしたカスタム音楽プレイヤー */
        #custom-player {
            margin: 20px auto; 
            max-width: 600px; 
            padding: 20px; 
            background: #1e222b; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2d3748;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 再生・一時停止ボタン */
        #play-btn {
            background: #00d2ff;
            border: none;
            color: #11141a;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            transition: all 0.2s ease;
            min-width: 80px;
        }
        #play-btn:hover {
            background: #00bcd4;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            transform: scale(1.03);
        }

        /* プログレスバー（進行状況の横棒）のコンテナ */
        #progress-container {
            flex-grow: 1;
            background: #2d3748;
            height: 8px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        /* 音楽が進むと伸びる青いバー */
        #progress-bar {
            background: linear-gradient(90deg, #00d2ff, #00f5ff);
            height: 100%;
            width: 0%; /* JSで動的に変更します */
            border-radius: 4px;
            box-shadow: 0 0 8px #00d2ff;
            transition: width 0.1s linear;
        }

        /* 時間表示 */
        #time-display {
            font-family: monospace;
            color: #a0aec0;
            font-size: 14px;
            min-width: 45px;
        }

        #typing-zone { 
            margin: 20px auto; 
            padding: 30px 20px; 
            background: #1e222b; 
            max-width: 600px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0, 210, 255, 0.15);
            border: 1px solid #2d3748;
        }
        #lyrics { 
            font-size: 26px; 
            font-weight: bold; 
            min-height: 40px; 
            color: #ffffff; 
            margin-bottom: 15px;
        }
        #input-display { 
            font-size: 22px; 
            letter-spacing: 2px; 
            font-family: 'Courier New', Courier, monospace;
            color: #4a5568; 
            min-height: 30px;
        }
        .typed { 
            color: #00d2ff; 
            font-weight: bold; 
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
        }
        .status-msg {
            color: #00d2ff;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <h1>DAYBREAK FRONTLINE</h1>
    <div class="subtitle">Music: Orangestar / Typing Game</div>

    <!-- 本物の音楽タグ -->
    <audio id="my-audio" src="bgm.mp3.wav"></audio>

    <!-- 🎧 自作したおしゃれな音楽プレイヤー -->
    <div id="custom-player">
        <button id="play-btn">PLAY</button>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="time-display">0:00</div>
    </div>

    <!-- タイピング画面 -->
    <div id="typing-zone">
        <div id="lyrics"></div>
        <div id="input-display"></div>
    </div>

    <script>
        const sequence = [
            { time: 0,  text: "間奏：タイピングの準備をしてください", target: "ready" },
            { time: 42.5,  text: "眠れないんだ風もなく茹だりそうな夜に", target: "nemurenaindakazemonakuudarisounayoruni" },
            { time: 46,  text: "君の声が耳元で揺らいだ感傷に浸ってばっか", target: "kiminokoegamimimotodeyuraidakannshounihitattebakka" },
            { time: 51,  text: "何も変わらない笑えない日々を", target: "nanimokawaranaiwaraenaihibiwo" },
            { time: 53,  text: "抜け出そうぜ君を連れ飛び出した", target: "nukedasouzekimiwoturetobidashita" },
        ];
        const audio = document.getElementById("my-audio");
        const playBtn = document.getElementById("play-btn");
        const progressBar = document.getElementById("progress-bar");
        const progressContainer = document.getElementById("progress-container");
        const timeDisplay = document.getElementById("time-display");

        let currentIndex = -1;
        let typedText = "";

        // 1. 再生・一時停止ボタンのクリック処理
        playBtn.addEventListener("click", () => {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "PAUSE";
                playBtn.style.background = "#ff007f"; // 一時停止時はピンクっぽく
                playBtn.style.boxShadow = "0 0 10px rgba(255, 0, 127, 0.3)";
            } else {
                audio.pause();
                playBtn.innerText = "PLAY";
                playBtn.style.background = "#00d2ff"; // 再生時は水色
                playBtn.style.boxShadow = "0 0 10px rgba(0, 210, 255, 0.3)";
            }
        });

        // 2. 音楽の時間更新に合わせて、バーとタイピング画面を動かす
        audio.addEventListener("timeupdate", () => {
            const currentTime = audio.currentTime;
            const duration = audio.duration || 0;

            // ─── プレイヤーの表示更新 ───
            if (duration > 0) {
                const progressPercent = (currentTime / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
            }

            // 分:秒 のテキスト表示
            const minutes = Math.floor(currentTime / 60);
            const seconds = Math.floor(currentTime % 60).toString().padStart(2, '0');
            timeDisplay.innerText = `${minutes}:${seconds}`;

            // ─── タイピング画面の連動 ───
            let foundIndex = -1;
            for (let i = 0; i < sequence.length; i++) {
                if (currentTime >= sequence[i].time) {
                    foundIndex = i;
                }
            }

            if (foundIndex !== currentIndex) {
                currentIndex = foundIndex;
                typedText = ""; 
                updateDisplay();
            }
        });

        // 3. バーの途中をクリックしたら、その場所に曲をスキップさせる
        progressContainer.addEventListener("click", (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        // 画面表示を更新する関数
        function updateDisplay() {
            const lyricsDiv = document.getElementById("lyrics");
            const displayDiv = document.getElementById("input-display");

            if (currentIndex === -1) {
                lyricsDiv.innerHTML = '<span class="status-msg">▶ボタンを押してスタート！</span>';
                displayDiv.innerHTML = "";
                return;
            }

            const currentData = sequence[currentIndex];
            lyricsDiv.innerText = currentData.text;

            let html = "";
            for (let i = 0; i < currentData.target.length; i++) {
                if (i < typedText.length) {
                    html += `<span class="typed">${currentData.target[i]}</span>`;
                } else {
                    html += `<span>${currentData.target[i]}</span>`;
                }
            }
            displayDiv.innerHTML = html;
        }

        // キー入力判定
        window.addEventListener("keydown", (e) => {
            if (currentIndex === -1 || e.key.length > 1) return;
            
            const currentData = sequence[currentIndex];
            const nextChar = currentData.target[typedText.length];

            // 念のため双方小文字にして比較
            if (e.key.toLowerCase() === (nextChar ? nextChar.toLowerCase() : "")) {
                typedText += nextChar;
                updateDisplay();

                if (typedText === currentData.target) {
                    document.getElementById("lyrics").innerHTML = "✨ OK! ✨";
                }
            }
        });

        // 【追加】ページ読み込み時、最初の状態（案内メッセージ）を表示させる
        updateDisplay();
    </script>
</body>
</html>
